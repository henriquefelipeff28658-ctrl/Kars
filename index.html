<main>
  <h2>Projetos disponíveis</h2>

    <p>Projeto de programação Lua.</p>
    <button onclick="copiar()">COPIAR CÓDIGO</button>
    <textarea id="codigo" hidden>--=============================================================
--  TROLL HUB v3  |  ESP + WalkSpeed + Bypass de Escuridão
--  Feito para: blind but dangerous (caçador / sobrevivente)
--=============================================================
local Players = game:GetService("Players")
local RunService = game:GetService("RunService")
local TweenService = game:GetService("TweenService")
local UIS = game:GetService("UserInputService")
local Lighting = game:GetService("Lighting")

local LocalPlayer = Players.LocalPlayer

-- PALETA
local WHITE = Color3.fromRGB(255, 255, 255)
local BLACK = Color3.fromRGB(0, 0, 0)
local DARK  = Color3.fromRGB(24, 24, 24)
local GRAY  = Color3.fromRGB(170, 170, 170)

-- CONFIG
local PANEL_W, PANEL_H = 232, 294
local DEFAULT_SPEED = 16
local activeSpeed = 120

local speedOn  = false
local espOn    = false
local bypassOn = true
local lastPos  = UDim2.new(0, 14, 0.5, -PANEL_H / 2)
local dragging, dragStart, startPos = false, nil, nil

-- HELPERS
local function new(class, props, parent)
	local obj = Instance.new(class)
	for k, v in pairs(props) do obj[k] = v end
	if parent then obj.Parent = parent end
	return obj
end
local function round(obj, r) new("UICorner", { CornerRadius = UDim.new(0, r) }, obj) end
local function stroke(obj, t) new("UIStroke", { Color = WHITE, Thickness = t or 1.5 }, obj) end
local function isDark(c3) return (c3.R + c3.G + c3.B) / 765 < 0.35 end

--=============================================================
-- SCREEN GUI
--=============================================================
local gui = new("ScreenGui", {
	Name = "TrollHubUI",
	ResetOnSpawn = false,
	IgnoreGuiInset = true,
	DisplayOrder = 9999,
	ZIndexBehavior = Enum.ZIndexBehavior.Sibling
})
local parentGui = game:GetService("CoreGui")
if gethui then parentGui = gethui() end
if not pcall(function() gui.Parent = parentGui end) then
	gui.Parent = LocalPlayer:WaitForChild("PlayerGui")
end

--=============================================================
-- PAINEL
--=============================================================
local main = new("Frame", {
	Name = "Main",
	Size = UDim2.new(0, PANEL_W, 0, PANEL_H),
	Position = lastPos,
	BackgroundColor3 = BLACK,
	BorderSizePixel = 0
}, gui)
round(main, 14); stroke(main, 1.5)
local uiScale = new("UIScale", { Scale = 1 }, main)

local topBar = new("Frame", { Size = UDim2.new(1, 0, 0, 44), BackgroundTransparency = 1 }, main)
new("TextLabel", {
	Size = UDim2.new(1, -70, 0, 44), Position = UDim2.new(0, 16, 0, 0),
	BackgroundTransparency = 1, Text = "TROLL HUB",
	TextColor3 = WHITE, Font = Enum.Font.GothamBold, TextSize = 15,
	TextXAlignment = Enum.TextXAlignment.Left
}, topBar)

local closeBtn = new("TextButton", {
	Size = UDim2.new(0, 26, 0, 26), Position = UDim2.new(1, -38, 0, 9),
	BackgroundColor3 = DARK, Text = "–", TextColor3 = WHITE,
	Font = Enum.Font.GothamBold, TextSize = 16, AutoButtonColor = false
}, topBar)
round(closeBtn, 9); stroke(closeBtn, 1.2)

new("Frame", {
	Size = UDim2.new(1, -32, 0, 1), Position = UDim2.new(0, 16, 0, 46),
	BackgroundColor3 = WHITE, BackgroundTransparency = 0.7, BorderSizePixel = 0
}, main)

local function makeButton(text, y, h)
	local b = new("TextButton", {
		Size = UDim2.new(1, -32, 0, h), Position = UDim2.new(0, 16, 0, y),
		BackgroundColor3 = DARK, Text = text, TextColor3 = WHITE,
		Font = Enum.Font.GothamMedium, TextSize = 14, AutoButtonColor = false
	}, main)
	round(b, 10); stroke(b, 1.2)
	return b
end

local espBtn    = makeButton("ESP   OFF", 58, 36)
local speedBtn  = makeButton("WALKSPEED   OFF", 100, 36)

-- INPUT DE VELOCIDADE (qualquer número)
local speedBox = new("TextBox", {
	Size = UDim2.new(1, -32, 0, 32), Position = UDim2.new(0, 16, 0, 142),
	BackgroundColor3 = DARK, Text = "Speed: " .. activeSpeed,
	PlaceholderText = "digite qualquer numero",
	PlaceholderColor3 = GRAY, TextColor3 = WHITE,
	Font = Enum.Font.GothamMedium, TextSize = 14,
	ClearTextOnFocus = false, TextXAlignment = Enum.TextXAlignment.Center
}, main)
round(speedBox, 9); stroke(speedBox, 1.2)

local bypassBtn = makeButton("BYPASS ESCURIDÃO   ON", 180, 36)
local flingBtn  = makeButton("FLING", 222, 34)

new("TextLabel", {
	Size = UDim2.new(1, -32, 0, 16), Position = UDim2.new(0, 16, 0, 262),
	BackgroundTransparency = 1, Text = "blind but dangerous  •  – fecha",
	TextColor3 = GRAY, Font = Enum.Font.Gotham, TextSize = 10
}, main)

-- BOLINHA
local openBtn = new("TextButton", {
	Size = UDim2.new(0, 46, 0, 46), Position = lastPos,
	BackgroundColor3 = BLACK, Text = "T", TextColor3 = WHITE,
	Font = Enum.Font.GothamBold, TextSize = 18, AutoButtonColor = false, Visible = false
}, gui)
round(openBtn, 100); stroke(openBtn, 2)
local circleScale = new("UIScale", { Scale = 1 }, openBtn)

--=============================================================
-- DRAG / ABRIR / FECHAR
--=============================================================
topBar.InputBegan:Connect(function(input)
	if input.UserInputType == Enum.UserInputType.MouseButton1
		or input.UserInputType == Enum.UserInputType.Touch then
		dragging, dragStart, startPos = true, input.Position, main.Position
		input.Changed:Connect(function()
			if input.UserInputState == Enum.UserInputState.End then
				dragging = false
				lastPos = main.Position
			end
		end)
	end
end)

UIS.InputChanged:Connect(function(input)
	if dragging and (input.UserInputType == Enum.UserInputType.MouseMovement
		or input.UserInputType == Enum.UserInputType.Touch) then
		local d = input.Position - dragStart
		main.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + d.X,
			startPos.Y.Scale, startPos.Y.Offset + d.Y)
		lastPos = main.Position
	end
end)

local animating = false
closeBtn.MouseButton1Click:Connect(function()
	if animating then return end
	animating = true
	TweenService:Create(uiScale, TweenInfo.new(0.14, Enum.EasingStyle.Quad, Enum.EasingDirection.In), { Scale = 0.85 }):Play()
	task.wait(0.14)
	main.Visible = false; uiScale.Scale = 1
	openBtn.Position = lastPos; openBtn.Visible = true
	circleScale.Scale = 0.5
	TweenService:Create(circleScale, TweenInfo.new(0.22, Enum.EasingStyle.Back, Enum.EasingDirection.Out), { Scale = 1 }):Play()
	animating = false
end)

openBtn.MouseButton1Click:Connect(function()
	if animating then return end
	animating = true
	openBtn.Visible = false; main.Visible = true
	main.Position = lastPos; uiScale.Scale = 0.85
	TweenService:Create(uiScale, TweenInfo.new(0.22, Enum.EasingStyle.Back, Enum.EasingDirection.Out), { Scale = 1 }):Play()
	animating = false
end)

local function paint(btn, on, tOn, tOff)
	btn.BackgroundColor3 = on and WHITE or DARK
	btn.TextColor3 = on and BLACK or WHITE
	btn.Text = on and tOn or tOff
end

--=============================================================
-- BYPASS DE ESCURIDÃO (o problema do caçador)
--=============================================================
local hiddenOverlays = {}   -- [instancia] = {prop=, old=}
local lastScan = 0

local function hideObj(obj, prop, value)
	if hiddenOverlays[obj] then return end
	local ok = pcall(function() hiddenOverlays[obj] = { prop = prop, old = obj[prop] } end)
	if ok then pcall(function() obj[prop] = value end) end
end

local function checkOverlay(obj)
	if hiddenOverlays[obj] or obj:IsDescendantOf(gui) then return end
	local cam = workspace.CurrentCamera
	if not cam then return end
	local screen = cam.ViewportSize
	local ok, abs = pcall(function() return obj.AbsoluteSize end)
	if not ok or not abs then return end
	if abs.X < screen.X * 0.72 or abs.Y < screen.Y * 0.72 then return end
	-- ignora o nosso próprio painel
	if obj:IsDescendantOf(main) then return end

	local nm = obj.Name:lower()
	local nameHit = nm:find("blind") or nm:find("dark") or nm:find("black")
		or nm:find("vision") or nm:find("shadow") or nm:find("fog")
		or nm:find("overlay") or nm:find("escur") or nm:find("noite")

	if obj:IsA("ImageLabel") or obj:IsA("ImageButton") then
		local vis = false
		pcall(function() vis = obj.ImageTransparency < 0.8 end)
		if vis and (isDark(obj.ImageColor3) or nameHit) then
			hideObj(obj, "ImageTransparency", 1)
		end
	elseif obj:IsA("GuiObject") then
		local vis = false
		pcall(function() vis = obj.BackgroundTransparency < 0.8 end)
		if vis and (isDark(obj.BackgroundColor3) or nameHit) then
			hideObj(obj, "BackgroundTransparency", 1)
		end
	end

	-- gradiente escuro dentro do overlay
	for _, g in ipairs(obj:GetChildren()) do
		if g:IsA("UIGradient") and (nameHit or true) then
			local okc, _ = pcall(function() return g.Transparency end)
			if okc then hideObj(g, "Enabled", false) end
		end
	end
end

local function scanGuis()
	local containers = { LocalPlayer:FindFirstChild("PlayerGui") }
	pcall(function() table.insert(containers, game:GetService("CoreGui")) end)
	for _, c in ipairs(containers) do
		if c then
			pcall(function()
				for _, d in ipairs(c:GetDescendants()) do
					if d:IsA("GuiObject") then checkOverlay(d) end
				end
			end)
		end
	end
end

local function scanWorld()
	local cam = workspace.CurrentCamera
	if not cam then return end
	-- Part preta presa na câmera / no workspace (blindfold 3D)
	for _, holder in ipairs({ cam, workspace }) do
		pcall(function()
			for _, obj in ipairs(holder:GetChildren()) do
				if obj:IsA("BasePart") and obj.Transparency < 0.95 and isDark(obj.Color) then
					local nm = obj.Name:lower()
					if nm:find("blind") or nm:find("dark") or nm:find("black")
						or nm:find("vision") or nm:find("fog") or nm:find("overlay") then
						hideObj(obj, "Transparency", 1)
					end
				end
			end
		end)
	end
end

local function fixLighting()
	pcall(function()
		Lighting.FogEnd = 1e6
		Lighting.FogStart = 0
		Lighting.Brightness = 2
		Lighting.ClockTime = 14
		Lighting.GlobalShadows = false
		Lighting.Ambient = Color3.fromRGB(170, 170, 170)
		Lighting.OutdoorAmbient = Color3.fromRGB(170, 170, 170)
		Lighting.EnvironmentDiffuseScale = 1
	end)
	pcall(function()
		for _, obj in ipairs(Lighting:GetChildren()) do
			if obj:IsA("Atmosphere") then
				pcall(function() obj.Density = 0; obj.Haze = 0; obj.Glare = 0 end)
			elseif obj:IsA("PostEffect") then
				pcall(function() obj.Enabled = false end)
			end
		end
	end)
end

local function restoreOverlays()
	for obj, data in pairs(hiddenOverlays) do
		pcall(function()
			if obj and obj.Parent then obj[data.prop] = data.old end
		end)
	end
	hiddenOverlays = {}
end

local function runBypass(force)
	if not bypassOn then return end
	fixLighting()
	scanWorld()
	local now = os.clock()
	if force or now - lastScan > 0.8 then
		lastScan = now
		scanGuis()
	end
	-- garante que nosso painel fica por cima da escuridão
	pcall(function() gui.DisplayOrder = 9999 end)
end

--=============================================================
-- ESP (Highlight + Drawing + nome/distância)
--=============================================================
local hasDrawing = false
do
	pcall(function()
		local d = Drawing.new("Square")
		d.Visible = false
		d:Remove()
		hasDrawing = true
	end)
end

local drawSets = {}

local function ensureDrawing(plr)
	if not (espOn and hasDrawing) or plr == LocalPlayer or drawSets[plr] then return end
	local sq, tx = Drawing.new("Square"), Drawing.new("Text")
	sq.Filled = false; sq.Color = WHITE; sq.Thickness = 1
	sq.Transparency = 1; sq.Visible = false
	tx.Size = 14; tx.Color = WHITE; tx.Visible = false
	pcall(function() tx.Center = true; tx.Outline = true; tx.OutlineColor = BLACK end)
	drawSets[plr] = { sq = sq, tx = tx }
end

local function clearDrawings()
	for _, s in pairs(drawSets) do
		pcall(function() s.sq:Remove() end)
		pcall(function() s.tx:Remove() end)
	end
	drawSets = {}
end

local function ensureHighlight(plr)
	if not espOn or plr == LocalPlayer then return end
	local char = plr.Character
	if not char then return end
	local hl = char:FindFirstChild("TrollHubHL")
	if hl then return end
	hl = Instance.new("Highlight")
	hl.Name = "TrollHubHL"
	hl.FillColor = WHITE
	hl.OutlineColor = WHITE
	hl.FillTransparency = 0.55
	hl.OutlineTransparency = 0
	hl.Parent = char
end

local function refreshESP()
	if not espOn then return end
	for _, plr in ipairs(Players:GetPlayers()) do
		ensureHighlight(plr)
		ensureDrawing(plr)
		-- alguns jogos "escondem" os outros jogadores do caçador
		if bypassOn and plr ~= LocalPlayer and plr.Character then
			for _, part in ipairs(plr.Character:GetChildren()) do
				if part:IsA("BasePart") then
					pcall(function()
						if part.LocalTransparencyModifier > 0.1 then
							part.LocalTransparencyModifier = 0
						end
					end)
				end
			end
		end
	end
end

local function clearESP()
	for _, plr in ipairs(Players:GetPlayers()) do
		local char = plr.Character
		local hl = char and char:FindFirstChild("TrollHubHL")
		if hl then hl:Destroy() end
	end
	clearDrawings()
end

RunService.RenderStepped:Connect(function()
	if not (espOn and hasDrawing) then return end
	local cam = workspace.CurrentCamera
	if not cam then return end
	for _, plr in ipairs(Players:GetPlayers()) do
		if plr ~= LocalPlayer then
			ensureDrawing(plr)
			local s = drawSets[plr]
			if s then
				local char = plr.Character
				local head = char and char:FindFirstChild("Head")
				local root = char and char:FindFirstChild("HumanoidRootPart")
				local hum  = char and char:FindFirstChildOfClass("Humanoid")
				local alive = head ~= nil and root ~= nil and hum ~= nil and hum.Health > 0
				if alive then
					local topPos, onScreen
					local okA, a, b = pcall(function()
						return cam:WorldToViewportPoint(head.Position + Vector3.new(0, 0.6, 0))
					end)
					if okA then
						topPos, onScreen = a, b
						local bottom = cam:WorldToViewportPoint(root.Position - Vector3.new(0, 2.8, 0))
						local h = math.abs(bottom.Y - topPos.Y)
						local w = h * 0.55
						local dist = math.floor((cam.CFrame.Position - head.Position).Magnitude)
						if onScreen and h > 4 then
							s.sq.Size = Vector2.new(w, h)
							s.sq.Position = Vector2.new(topPos.X - w / 2, topPos.Y)
							s.sq.Visible = true
							s.tx.Text = string.format("%s [%dm]", plr.Name, dist)
							s.tx.Position = Vector2.new(topPos.X, topPos.Y - 18)
							s.tx.Visible = true
						else
							s.sq.Visible = false; s.tx.Visible = false
						end
					end
				else
					s.sq.Visible = false; s.tx.Visible = false
				end
			end
		end
	end
end)

local function hookPlayer(plr)
	plr.CharacterAdded:Connect(function()
		task.wait(0.7)
		if espOn then refreshESP() end
	end)
end
for _, plr in ipairs(Players:GetPlayers()) do hookPlayer(plr) end
Players.PlayerAdded:Connect(hookPlayer)

espBtn.MouseButton1Click:Connect(function()
	espOn = not espOn
	paint(espBtn, espOn, "ESP   ON", "ESP   OFF")
	if espOn then refreshESP() else clearESP() end
end)

bypassBtn.MouseButton1Click:Connect(function()
	bypassOn = not bypassOn
	paint(bypassBtn, bypassOn, "BYPASS ESCURIDÃO   ON", "BYPASS ESCURIDÃO   OFF")
	if bypassOn then
		runBypass(true)
	else
		restoreOverlays()
	end
end)

--=============================================================
-- WALKSPEED (qualquer número)
--=============================================================
local function getHum()
	local char = LocalPlayer.Character
	return char and char:FindFirstChildOfClass("Humanoid")
end

local function applySpeed()
	local hum = getHum()
	if hum then hum.WalkSpeed = speedOn and activeSpeed or DEFAULT_SPEED end
end

local function commitSpeed()
	local n = tonumber((speedBox.Text:gsub("[^%d%.%-]", "")))
	if n then
		activeSpeed = math.clamp(n, 0, 100000)
	else
		activeSpeed = DEFAULT_SPEED
	end
	speedBox.Text = "Speed: " .. activeSpeed
	if speedOn then applySpeed() end
end

speedBox.FocusLost:Connect(commitSpeed)
speedBox.FocusLost:Connect(function(enter) if enter then commitSpeed() end end)

speedBtn.MouseButton1Click:Connect(function()
	speedOn = not speedOn
	paint(speedBtn, speedOn, "WALKSPEED   ON", "WALKSPEED   OFF")
	applySpeed()
end)

LocalPlayer.CharacterAdded:Connect(function()
	task.wait(1)
	if speedOn then applySpeed() end
	if espOn then refreshESP() end
end)

RunService.Heartbeat:Connect(function()
	if speedOn then
		local hum = getHum()
		if hum and math.abs(hum.WalkSpeed - activeSpeed) > 0.1 then
			hum.WalkSpeed = activeSpeed
		end
	end
end)

--=============================================================
-- FLING
--=============================================================
flingBtn.MouseButton1Click:Connect(function()
	local mouse = LocalPlayer:GetMouse()
	local part = mouse.Target
	if not part then return end
	local plr = Players:GetPlayerFromCharacter(part.Parent) or Players:GetPlayerFromCharacter(part.Parent.Parent)
	if not plr or plr == LocalPlayer or not plr.Character then return end
	local myRoot = LocalPlayer.Character and LocalPlayer.Character:FindFirstChild("HumanoidRootPart")
	local tRoot  = plr.Character:FindFirstChild("HumanoidRootPart")
	if not myRoot or not tRoot then return end
	local old = myRoot.CFrame
	for _ = 1, 2 do
		myRoot.CFrame = tRoot.CFrame * CFrame.new(0, 3, 0)
		task.wait(0.08)
		myRoot.CFrame = old
		task.wait(0.08)
	end
end)

--=============================================================
-- WATCHDOG (mantém o bypass e o ESP vivos)
--=============================================================
task.spawn(function()
	while gui.Parent do
		if bypassOn then runBypass(false) end
		if espOn then refreshESP() end
		task.wait(0.6)
	end
	clearDrawings()
end)

runBypass(true)
print("[Troll Hub v3] carregado - bypass ativo, ESP pronto")</textarea>
