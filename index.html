--===================== HITBOX ========================================
local Store = setmetatable({}, {__mode = "k"})
local function scalePart(part, scale)
	local d = Store[part]
	if not d then
		d = {Size = part.Size, CanCollide = part.CanCollide}
		Store[part] = d
		d.Conn = part:GetPropertyChangedSignal("Size"):Connect(function()
			local cur = Store[part]
			if cur and cur.Want and part.Size ~= cur.Size * cur.Want then
				part.Size = cur.Size * cur.Want
			end
		end)
	end
	d.Want = scale
	part.Size = d.Size * scale
	part.CanCollide = false
end
local function restorePart(part)
	local d = Store[part]
	if d then
		d.Want = nil
		part.Size = d.Size
		part.CanCollide = d.CanCollide
		if d.Conn then d.Conn:Disconnect() end
		Store[part] = nil
	end
end

	end
end)

--============ WALKSPEED + ANTI-FLING =================================
local flingUntil, anchorUntil = 0, 0

local function antiFlingTick(hum, hrp)
	local v   = hrp.AssemblyLinearVelocity
	local now = os.clock()

	if CFG.Misc.AnchorOnFling and now < anchorUntil then
		hrp.Anchored = true
		if now >= anchorUntil - 0.02 then
			hrp.Anchored = false
			hrp.AssemblyLinearVelocity = Vector3.zero
		end
		return
	end

	local flat = Vector3.new(v.X, 0, v.Z).Magnitude
	local vert = math.abs(v.Y)

	if flat > CFG.Misc.MaxSafeVel or vert > CFG.Misc.MaxSafeVel then
		if CFG.Misc.HardAntiFling then
			hrp.AssemblyLinearVelocity = Vector3.zero
			flingUntil = now + 0.12
			if CFG.Misc.AnchorOnFling and (flat > CFG.Misc.MaxSafeVel * 2 or vert > CFG.Misc.MaxSafeVel * 2) then
				anchorUntil = now + 0.15
				hrp.Anchored = true
			end
		else
			local dir   = hum.MoveDirection
			local base  = math.max(hum.WalkSpeed, 16)
			local keepY = vert > CFG.Misc.MaxSafeVel and 0 or v.Y
			hrp.AssemblyLinearVelocity = Vector3.new(dir.X * base, keepY, dir.Z * base)
		end
	elseif now < flingUntil then
		hrp.AssemblyLinearVelocity = Vector3.zero
	end
end

local function miscTick()
	local char = LP.Character
	if not char then return end
	local hum = char:FindFirstChildOfClass("Humanoid")
	local hrp = char:FindFirstChild("HumanoidRootPart")
	if not (hum and hrp and hrp:IsA("BasePart")) then return end

	if CFG.Misc.WalkSpeedOn and hum.WalkSpeed ~= CFG.Misc.WalkSpeed then
		pcall(function() hum.WalkSpeed = CFG.Misc.WalkSpeed end)
	end
	if CFG.Misc.NoKnockback and not State.staff then
		pcall(antiFlingTick, hum, hrp)
	end
end

RunService.Heartbeat:Connect(function() pcall(miscTick) end)

local lastSeen = nil

local function findNextAbilityValue()
	local roots = {LP, LP.Character, LP:FindFirstChildOfClass("Backpack"), LP.PlayerGui}
	for _, root in ipairs(roots) do
		if root then
			for k, v in pairs(root:GetAttributes()) do
				local nm = string.lower(k)
				if (type(v) == "string" and v ~= "" or type(v) == "number")
					and (nm:find("next", 1, true) or nm:find("queued", 1, true)
						or nm:find("pending", 1, true) or nm:find("roll", 1, true)
						or nm:find("attack", 1, true) or nm:find("ability", 1, true)
						or nm:find("skill", 1, true) or nm:find("spell", 1, true)) then
					return tostring(v)
				end
			end
			for _, d in ipairs(root:GetDescendants()) do
				if d:IsA("StringValue") or d:IsA("ObjectValue") then
					local nm = string.lower(d.Name)
					if nm:find("next", 1, true) or nm:find("queued", 1, true)
						or nm:find("pending", 1, true) or nm:find("roll", 1, true) then
						local val = d:IsA("ObjectValue") and (d.Value and d.Value.Name or "-") or d.Value
						return tostring(val)
					end
				end
			end
		end
	end
	return nil
end

--========================== AIMBOT ===================================
local EXCLUDE = Enum.RaycastFilterType.Exclude or Enum.RaycastFilterType.Blacklist
local rp = RaycastParams.new()
rp.FilterType, rp.IgnoreWater = EXCLUDE, true

local function visible(cam, char, pos)
	if not CFG.Aimbot.WallCheck then return true end
	local f = {cam}
	if LP.Character then f[#f + 1] = LP.Character end
	if char then f[#f + 1] = char end
	rp.FilterDescendantsInstances = f
	return WS:Raycast(cam.CFrame.Position, pos - cam.CFrame.Position, rp) == nil
end

local function aimPartOf(char)
	if not char then return nil end
	local p = char:FindFirstChild(CFG.Aimbot.AimPart)
	if p and p:IsA("BasePart") then return p end
	for _, n in ipairs({"Head","UpperTorso","Torso","HumanoidRootPart"}) do
		local q = char:FindFirstChild(n)
		if q and q:IsA("BasePart") then return q end
	end
end

local function targetFromPlayer(plr)
	if not plr or not plr.Parent then return nil end
	local char = plr.Character
	local hum  = char and char:FindFirstChildOfClass("Humanoid")
	if not (char and char.Parent and hum and hum.Health > 0) then return nil end
	local part = aimPartOf(char)
	if not part then return nil end
	return {player = plr, part = part, char = char}
end

local function findTarget(cam)
	local camPos, look = cam.CFrame.Position, cam.CFrame.LookVector
	local best, bestDist = nil, math.huge
	for _, plr in ipairs(Players:GetPlayers()) do
		if plr ~= LP then
			local t = targetFromPlayer(plr)
			if t then
				local pos, dist = t.part.Position, (t.part.Position - camPos).Magnitude
				if dist <= CFG.Aimbot.MaxDistance and dist < bestDist and dist > 0.5 then
					local angle = math.deg(math.acos(math.clamp(look:Dot((pos - camPos).Unit), -1, 1)))
					if angle <= CFG.Aimbot.FOV * 0.5 and visible(cam, t.char, pos) then
						best, bestDist = t, dist
					end
				end
			end
		end
	end
	return best
end

local LockCF, Applying, CamConn = nil, false, nil
local function attachCamera(cam)
	if CamConn then CamConn:Disconnect() end
	if not cam then return end
	CamConn = cam:GetPropertyChangedSignal("CFrame"):Connect(function()
		if Applying or not LockCF or not State.aimActive then return end
		Applying = true
		pcall(function() cam.CFrame = LockCF end)
		Applying = false
	end)
end
attachCamera(WS.CurrentCamera)
table.insert(State.conns, WS:GetPropertyChangedSignal("CurrentCamera"):Connect(function()
	attachCamera(WS.CurrentCamera)
end))

local BIND = "RNGScroll_Hub_Aim"
local function aimStep(dt)
	local cam = WS.CurrentCamera
	if not cam then return end
	local cfg = CFG.Aimbot
	local engaged = (not cfg.RequireHold) or State.aimToggle or State.aimHeld
	local active  = cfg.Enabled and engaged and not State.staff
	State.aimActive = active

	local char = LP.Character
	local hum  = char and char:FindFirstChildOfClass("Humanoid")
	local hrp  = char and char:FindFirstChild("HumanoidRootPart")

	if not active then
		LockCF, State.lockedPlayer, State.targetName = nil, nil, "-"
		if hum and hum.AutoRotate == false then hum.AutoRotate = true end
		return
	end

	if cfg.ForceCamera and cam.CameraType == Enum.CameraType.Scriptable then
		cam.CameraType = Enum.CameraType.Custom
	end

	local target
	if cfg.StickyTarget and State.lockedPlayer then
		local t = targetFromPlayer(State.lockedPlayer)
		if t and (t.part.Position - cam.CFrame.Position).Magnitude <= cfg.StickyRange then
			target = t
		else
			State.lockedPlayer = nil
		end
	end
	if not target then
		target = findTarget(cam)
		if target then State.lockedPlayer = target.player end
	end
	if not target then
		LockCF, State.targetName = nil, "-"
		if hum and hum.AutoRotate == false then hum.AutoRotate = true end
		return
	end

	State.lockedPlayer, State.targetName = target.player, target.player.Name
	State.targetDist = math.floor((target.part.Position - cam.CFrame.Position).Magnitude)

	local pt = target.part
	local aimPos = pt.Position + pt.AssemblyLinearVelocity * cfg.Prediction
	local camPos, dir = cam.CFrame.Position, aimPos - cam.CFrame.Position
	if dir.Magnitude < 0.5 then return end

	local desired = CFrame.lookAt(camPos, aimPos)
	Applying = true
	if cfg.HardLock or cfg.Smoothing <= 0 then
		cam.CFrame = desired
		LockCF = desired
	else
		local tau   = 0.02 + cfg.Smoothing * 0.45
		local alpha = math.clamp(1 - math.exp(-dt / tau), 0.06, 1)
		cam.CFrame  = cam.CFrame:Lerp(desired, alpha)
		LockCF      = nil
	end
	Applying = false

	if hum and hrp and hrp:IsA("BasePart") and not hrp.Anchored then
		if cfg.FaceAim then
			if hum.AutoRotate then hum.AutoRotate = false end
			local p, tp = hrp.Position, pt.Position
			local flat = Vector3.new(tp.X, p.Y, tp.Z)
			if (flat - p).Magnitude > 0.2 then
				pcall(function() hrp.CFrame = CFrame.lookAt(p, flat) end)
			end
			if cfg.StopOnAim then pcall(function() hum:Move(Vector3.new(), false) end) end
		elseif hum.AutoRotate == false then
			hum.AutoRotate = true
		end
	end
end

local function attachAimLoop()
	pcall(function() RunService:UnbindFromRenderStep(BIND) end)
	RunService:BindToRenderStep(BIND, Enum.RenderPriority.Last.Value, aimStep)
end
attachAimLoop()

local function mk(class, props, parent)
	local o = Instance.new(class)
	for k, v in pairs(props or {}) do o[k] = v end
	if parent then o.Parent = parent end
	return o
end

local function makeDraggable(handle, target)
	local dragInput, startMouse, startPos
	handle.InputBegan:Connect(function(input)
		if input.UserInputType == Enum.UserInputType.MouseButton1
			or input.UserInputType == Enum.UserInputType.Touch then
			dragInput, startMouse, startPos = input, input.Position, target.Position
			input.Changed:Connect(function()
				if input.UserInputState == Enum.UserInputState.End then dragInput = nil end
			end)
		end
	end)
	handle.InputChanged:Connect(function(input)
		if input == dragInput then
			local d = input.Position - startMouse
			target.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + d.X,
				startPos.Y.Scale, startPos.Y.Offset + d.Y)
		end
	end)
end

local function addStepper(pageName, text, get, set, step, minv, maxv, fmt)
	local r = row(pageName)
	mk("TextLabel", {
		Size = UDim2.new(1, -158, 1, 0), Position = UDim2.new(0, 10, 0, 0),
		BackgroundTransparency = 1, Font = Enum.Font.GothamMedium, TextSize = 12,
		TextColor3 = CFG.UI.Text, TextXAlignment = Enum.TextXAlignment.Left, Text = text,
	}, r)
	local val = mk("TextLabel", {
		Size = UDim2.fromOffset(50, 22), Position = UDim2.new(1, -106, 0.5, -11),
		BackgroundColor3 = Color3.fromRGB(32, 12, 14), BorderSizePixel = 0,
		Font = Enum.Font.GothamBold, TextSize = 11, TextColor3 = CFG.UI.Text, Text = fmt(get()),
	}, r)
	mk("UICorner", {CornerRadius = UDim.new(0, 5)}, val)
	local function btn(sym, x)
		local b = mk("TextButton", {
			Size = UDim2.fromOffset(24, 24), Position = UDim2.new(1, x, 0.5, -12),
			BackgroundColor3 = Color3.fromRGB(52, 16, 20), BorderSizePixel = 0,
			Text = sym, Font = Enum.Font.GothamBold, TextSize = 14,
			TextColor3 = CFG.UI.Text, AutoButtonColor = false,
		}, r)
		mk("UICorner", {CornerRadius = UDim.new(0, 5)}, b)
		return b
	end
	local function upd(v)
		v = math.floor(math.clamp(v, minv, maxv) * 100 + 0.5) / 100
		set(v)
		val.Text = fmt(v)
	end
	btn("-", -52).MouseButton1Click:Connect(function() upd(get() - step) end)
	btn("+", -26).MouseButton1Click:Connect(function() upd(get() + step) end)
end

local aimBtn = mk("TextButton", {

local function paintAim()
	local on = State.aimToggle or State.aimHeld
	aimBtn.BackgroundColor3 = on and CFG.UI.Accent or Color3.fromRGB(20, 10, 12)
	aimBtn.TextColor3 = on and Color3.fromRGB(15, 5, 6) or CFG.UI.Accent
end

do
	local pressAt, moved = 0, false
	aimBtn.InputBegan:Connect(function(i)
		if i.UserInputType == Enum.UserInputType.Touch
			or i.UserInputType == Enum.UserInputType.MouseButton1 then
			pressAt, moved = os.clock(), false
			State.aimHeld = true
			paintAim()
			i.Changed:Connect(function()
				if i.UserInputState == Enum.UserInputState.End then
					State.aimHeld = false
					if not moved and os.clock() - pressAt < 0.25 then
						State.aimToggle = not State.aimToggle
					end
					paintAim()
				end
			end)
		end
	end)
	aimBtn.InputChanged:Connect(function(i)
		if (i.UserInputType == Enum.UserInputType.Touch
			or i.UserInputType == Enum.UserInputType.MouseMovement)
			and math.abs(i.Delta.X) + math.abs(i.Delta.Y) > 6 then
			moved = true
		end
	end)
	makeDraggable(aimBtn, aimBtn)
end

	elseif i.KeyCode == Enum.KeyCode[CFG.Aimbot.ToggleKey] then

end))

local function unload()
	pcall(function() RunService:UnbindFromRenderStep(BIND) end)
	if CamConn then CamConn:Disconnect() end
	for _, c in ipairs(State.conns) do pcall(function() c:Disconnect() end) end
	for _, p in ipairs(Players:GetPlayers()) do
		if p.Character then
			for _, n in ipairs(ENEMY_PARTS) do
				local part = p.Character:FindFirstChild(n)
				if part and part:IsA("BasePart") then restorePart(part) end
			end
		end
	end
	local hrp = LP.Character and LP.Character:FindFirstChild("HumanoidRootPart")
	if hrp then hrp.Anchored = false end
	local hum = LP.Character and LP.Character:FindFirstChildOfClass("Humanoid")
	if hum then hum.AutoRotate = true end
	gui:Destroy()
	_G.RNGScrollUnload = nil
end
_G.RNGScrollUnload = unload
